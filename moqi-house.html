<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2b2622;--sub:#7a6f66;--line:#e4dbcf;--accent:#b5653b;--accent2:#2f6f62;--ok:#2f8a4e;--shadow:0 2px 10px #0000000f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--card:#262320;--ink:#f1ebe4;--sub:#a99e93;--line:#3a3530;--accent:#e08a5b;--accent2:#5fb3a1;--ok:#5cc47e;--shadow:0 2px 10px #0000004d}}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#262320;--ink:#f1ebe4;--sub:#a99e93;--line:#3a3530;--accent:#e08a5b;--accent2:#5fb3a1;--ok:#5cc47e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5}
#app{max-width:760px;margin:0 auto;padding:12px 16px 120px}
h1{font-size:26px;margin:18px 0 4px;letter-spacing:2px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.sec{background:var(--accent2);border-color:var(--accent2);color:#fff}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mt{margin-top:10px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.tog{padding:6px 10px;font-size:13px}
.tog.on{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.players{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.pc{flex:0 0 auto;padding:6px 10px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:13px;white-space:nowrap}
.pc.cur{border-color:var(--accent)}
.pc.off{opacity:.5}
.pc .r{font-size:12px;color:var(--sub)}
.floor{font-size:12px;color:var(--sub);margin:6px 2px 2px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.board.locked .slot,.board.locked .paint{pointer-events:none}
.room{border:3px solid var(--wall);background:color-mix(in srgb,var(--wall) 22%,var(--card));border-radius:14px;padding:8px}
.room-h{display:flex;justify-content:space-between;align-items:center;gap:4px;font-weight:600;font-size:14px}
.paint{padding:3px 8px;font-size:12px;background:var(--wall);color:#fff;border:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.slot{position:relative;aspect-ratio:1/1.15;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line)}
.slot.empty{border-style:dashed;background:transparent}
.slot .ph{font-size:11px;color:var(--sub);line-height:1.3}
.slot svg{width:70%;height:auto}
.slot .mk{position:absolute;top:2px;right:4px;font-size:11px}
.slot .lb{font-size:10px;color:var(--sub)}
.flash{animation:fl 1.6s ease 2}
@keyframes fl{50%{box-shadow:0 0 0 4px var(--accent)}}
.panel{position:sticky;bottom:0;z-index:4}
.reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.reacts button{font-size:16px;padding:12px 4px}
.conds{list-style:none;padding:0;margin:6px 0 0}
.conds li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line)}
.conds li:first-child{border-top:none}
.conds .t{flex:1}
.conds .chk{font-size:16px}
.conds button{padding:3px 8px;font-size:12px}
.log{max-height:200px;overflow:auto;font-size:13px;color:var(--sub)}
.log div{padding:2px 0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
#sheet{position:fixed;inset:0;z-index:20;display:none;background:#0007;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .box{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:8px;text-align:left}
.opt svg{width:34px;height:34px;flex:0 0 auto}
.sw{width:22px;height:22px;border-radius:6px;flex:0 0 auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.end{text-align:center}
.end .big{font-size:40px}
details summary{cursor:pointer;font-weight:600}
.code{font-size:30px;letter-spacing:6px;font-weight:700;color:var(--accent)}
.listen{animation:pu 1s infinite}
@keyframes pu{50%{opacity:.5}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" onclick="if(event.target.id==='sheet')closeSheet()"><div class="box" id="sheetBox"></div></div>
<div id="toast"></div>
<div id="audios" style="display:none"></div>
<script>
/* ========== 安全儲存（預覽環境可能封鎖 localStorage） ========== */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
window.addEventListener('error',e=>{try{toast('錯誤：'+(e.message||'未知'))}catch(_){}});
/* ========== 基本資料 ========== */
const ROOMS=['臥室','浴室','客廳','廚房'];
const ROOM_ICON=['🛏️','🛁','🛋️','🍳'];
const TYPES=['燈具','掛畫','擺飾'];
const COLORS=[{n:'紅',c:'#d2504a'},{n:'綠',c:'#3f9a5c'},{n:'藍',c:'#4677cf'},{n:'黃',c:'#e0a526'}];
const STYLES=['現代','復古','古典','奇趣'];
const STYLE_MARK=['◆','●','♛','✦'];
const AREAS={up:[0,1],down:[2,3],left:[0,2],right:[1,3]};
const AREA_NAME={up:'樓上（臥室＋浴室）',down:'樓下（客廳＋廚房）',left:'左側（臥室＋客廳）',right:'右側（浴室＋廚房）'};
const CFG={2:{k:5,rounds:30,reveal:[15,20,25]},3:{k:4,rounds:20,reveal:[10,14,17]},4:{k:3,rounds:15,reveal:[8,11,13]}};
const REACT={good:'😍 喜歡',meh:'😐 還好',bad:'😣 不喜歡'};
const styleOf=(t,c)=>(c+t)%4;
const CN=c=>COLORS[c].n;
const itemName=(t,c)=>`${CN(c)}色${STYLES[styleOf(t,c)]}${TYPES[t]}`;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

function objs(h,r){const o=[];h.slots[r].forEach((c,t)=>{if(c!==null)o.push({t,c,s:styleOf(t,c)})});return o}
function feats(h,r){return [h.walls[r],...objs(h,r).map(o=>o.c)]}
function allObjs(h){return [0,1,2,3].flatMap(r=>objs(h,r))}
function areaCount(h,a,c){return AREAS[a].reduce((x,r)=>x+feats(h,r).filter(v=>v===c).length,0)}

/* ========== 條件（每局隨機產生） ========== */
const COND={
 wallIs:{ev:(h,p)=>h.walls[p.r]===p.c,tx:p=>`${ROOMS[p.r]}的牆壁要是${CN(p.c)}色`},
 wallNot:{ev:(h,p)=>h.walls[p.r]!==p.c,tx:p=>`${ROOMS[p.r]}的牆壁不能是${CN(p.c)}色`},
 roomHas:{ev:(h,p)=>objs(h,p.r).some(o=>o.c===p.c),tx:p=>`${ROOMS[p.r]}至少要有一件${CN(p.c)}色物品`},
 roomNoColor:{ev:(h,p)=>!feats(h,p.r).includes(p.c),tx:p=>`${ROOMS[p.r]}不能出現${CN(p.c)}色（牆壁也算）`},
 styleMin:{ev:(h,p)=>allObjs(h).filter(o=>o.s===p.s).length>=p.n,tx:p=>`整間房子至少要有 ${p.n} 件${STYLES[p.s]}風格物品`},
 styleMax:{ev:(h,p)=>allObjs(h).filter(o=>o.s===p.s).length<=p.n,tx:p=>p.n===0?`整間房子不能有任何${STYLES[p.s]}風格物品`:`整間房子最多只能有 ${p.n} 件${STYLES[p.s]}風格物品`},
 typeIn:{ev:(h,p)=>h.slots[p.r][p.t]!==null,tx:p=>`${ROOMS[p.r]}一定要有${TYPES[p.t]}`},
 typeOut:{ev:(h,p)=>h.slots[p.r][p.t]===null,tx:p=>`${ROOMS[p.r]}不要放${TYPES[p.t]}`},
 areaColorMin:{ev:(h,p)=>areaCount(h,p.a,p.c)>=p.n,tx:p=>`${AREA_NAME[p.a]}的${CN(p.c)}色至少 ${p.n} 處（牆壁也算）`},
 areaNoStyle:{ev:(h,p)=>!AREAS[p.a].some(r=>objs(h,r).some(o=>o.s===p.s)),tx:p=>`${AREA_NAME[p.a]}不能有${STYLES[p.s]}風格物品`},
 everyRoom:{ev:h=>[0,1,2,3].every(r=>objs(h,r).length>0),tx:()=>`每個房間都至少要有一件物品`},
 noDup:{ev:h=>[0,1,2,3].every(r=>{const cs=objs(h,r).map(o=>o.c);return new Set(cs).size===cs.length}),tx:()=>`同一個房間裡，物品的顏色不能重複`},
 totalMax:{ev:(h,p)=>allObjs(h).length<=p.n,tx:p=>`全家物品總數最多 ${p.n} 件`},
 totalMin:{ev:(h,p)=>allObjs(h).length>=p.n,tx:p=>`全家物品總數至少 ${p.n} 件`},
 moreThan:{ev:(h,p)=>objs(h,p.a).length>objs(h,p.b).length,tx:p=>`${ROOMS[p.a]}的物品數要比${ROOMS[p.b]}多`},
 sameWall:{ev:(h,p)=>h.walls[p.a]===h.walls[p.b],tx:p=>`${ROOMS[p.a]}和${ROOMS[p.b]}的牆壁要同色`},
 diffWall:{ev:(h,p)=>h.walls[p.a]!==h.walls[p.b],tx:p=>`${ROOMS[p.a]}和${ROOMS[p.b]}的牆壁不能同色`},
 typeColor:{ev:(h,p)=>[0,1,2,3].some(r=>h.slots[r][p.t]===p.c),tx:p=>`家裡要有一件${CN(p.c)}色的${TYPES[p.t]}`}
};
const condMet=(h,x)=>COND[x.k].ev(h,x.p);
const condText=x=>COND[x.k].tx(x.p);

function randHouse(){return{walls:[0,1,2,3].map(()=>rnd(4)),slots:[0,1,2,3].map(()=>[0,1,2].map(()=>Math.random()<0.55?rnd(4):null))}}
function candidates(T){
 const C=[];const add=(k,p={})=>{if(COND[k].ev(T,p))C.push({k,p})};
 const tot=allObjs(T).length;
 for(let r=0;r<4;r++){
  add('wallIs',{r,c:T.walls[r]});
  add('wallNot',{r,c:(T.walls[r]+1+rnd(3))%4});
  for(let c=0;c<4;c++)add('roomHas',{r,c});
  const ab=[0,1,2,3].filter(c=>!feats(T,r).includes(c));if(ab.length)add('roomNoColor',{r,c:ab[rnd(ab.length)]});
  for(let t=0;t<3;t++){add('typeIn',{r,t});add('typeOut',{r,t})}
 }
 for(let s=0;s<4;s++){const n=allObjs(T).filter(o=>o.s===s).length;if(n>=2)add('styleMin',{s,n});if(n<=2)add('styleMax',{s,n})}
 for(const a in AREAS){for(let c=0;c<4;c++){const n=areaCount(T,a,c);if(n>=2)add('areaColorMin',{a,c,n})}for(let s=0;s<4;s++)add('areaNoStyle',{a,s})}
 add('everyRoom');add('noDup');
 if(tot<=7)add('totalMax',{n:tot});if(tot>=5)add('totalMin',{n:tot});
 for(let a=0;a<4;a++)for(let b=0;b<4;b++)if(a!==b)add('moreThan',{a,b});
 for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){add('sameWall',{a,b});add('diffWall',{a,b})}
 for(let t=0;t<3;t++)for(let c=0;c<4;c++)add('typeColor',{t,c});
 return C;
}
function pickConds(T,S,n,k){
 const C=candidates(T),key=x=>x.k+JSON.stringify(x.p),used=new Set(),res=[];
 for(let i=0;i<n;i++){
  const mine=[],kinds=new Set(),needFalse=Math.ceil(k*0.6);
  for(let j=0;j<k;j++){
   let pool=C.filter(x=>!used.has(key(x))&&!kinds.has(x.k)&&(j>=needFalse||!condMet(S,x)));
   if(!pool.length)pool=C.filter(x=>!used.has(key(x))&&!kinds.has(x.k));
   if(!pool.length)return null;
   const ks=[...new Set(pool.map(x=>x.k))],kk=ks[rnd(ks.length)],sub=pool.filter(x=>x.k===kk),x=sub[rnd(sub.length)];
   used.add(key(x));kinds.add(x.k);mine.push(x);
  }
  if(mine.every(x=>condMet(S,x)))return null;
  res.push(mine);
 }
 return res;
}

/* ========== 網路連線（PeerJS，免登入） ========== */
const PEER_CFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]}};
const PREFIX='moqi-house-';
let peer=null,isHost=false,hostConn=null,conns={},G=null,view=null,roomCode='';
let myName=store.get('mq_name')||'';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function genCode(){const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=s[rnd(s.length)];return c}
function getName(){const n=($('#nm')?.value||myName).trim();if(!n){toast('請先輸入暱稱');return null}myName=n.slice(0,10);store.set('mq_name',myName);return myName}

function createRoom(){
 if(!window.Peer){toast('連線套件載入失敗，請用 GitHub Pages 網址開啟並確認網路');return}
 const n=getName();if(!n)return;
 roomCode=genCode();isHost=true;
 peer=new Peer(PREFIX+roomCode,PEER_CFG);
 peer.on('open',id=>{
  G={hostPid:id,code:roomCode,phase:'lobby',players:[{pid:id,name:n,connected:true,voice:false}],log:[],logId:0};
  try{history.replaceState(null,'','?room='+roomCode)}catch(e){}
  broadcast();
 });
 peer.on('connection',conn=>{
  conn.on('open',()=>{conns[conn.peer]=conn});
  conn.on('data',m=>handle(conn.peer,m));
  conn.on('close',()=>{const p=G.players.find(x=>x.pid===conn.peer);delete conns[conn.peer];if(p){if(G.phase==='lobby')G.players=G.players.filter(x=>x!==p);else{p.connected=false;p.voice=false;addLog(`${p.name} 斷線了`);if(G.phase==='react'){G.pending=G.pending.filter(x=>x!==p.pid);if(!G.pending.length)advance()}}broadcast()}});
 });
 peer.on('call',onCall);
 peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();createRoom()}else toast('連線錯誤：'+e.type)});
}
function joinRoom(code){
 if(!window.Peer){toast('連線套件載入失敗，請用 GitHub Pages 網址開啟並確認網路');return}
 const n=getName();if(!n)return;
 code=(code||$('#rc')?.value||'').trim().toUpperCase();if(!code){toast('請輸入房間代碼');return}
 roomCode=code;isHost=false;
 if(peer)peer.destroy();
 peer=new Peer(PEER_CFG);
 peer.on('open',()=>{
  hostConn=peer.connect(PREFIX+code,{reliable:true});
  hostConn.on('open',()=>{hostConn.send({t:'join',name:n});try{history.replaceState(null,'','?room='+code)}catch(e){}});
  hostConn.on('data',m=>{
   if(m.t==='state'){const first=!view;view=m.v;if(first)lastSpoken=view.log.length?view.log[view.log.length-1].id:0;else speakNew();render()}
   else if(m.t==='err'){toast(m.m);view=null;render()}
  });
  hostConn.on('close',()=>{toast('與房主斷線，可按「重新連線」');lostHost=true;render()});
 });
 peer.on('call',onCall);
 peer.on('error',e=>{if(e.type==='peer-unavailable')toast('找不到這個房間，確認代碼或請房主開著頁面');else toast('連線錯誤：'+e.type)});
}
let lostHost=false;
function reconnect(){lostHost=false;view=null;joinRoom(roomCode)}
function send(m){if(isHost)handle(peer.id,m);else if(hostConn&&hostConn.open)hostConn.send(m);else toast('尚未連上房主')}

/* ========== 房主：遊戲邏輯 ========== */
function addLog(text,say){G.log.push({id:++G.logId,text,say:say||text});if(G.log.length>80)G.log.shift()}
function P(pid){return G.players.find(p=>p.pid===pid)}
function allMet(p){return p.conds&&p.conds.every(x=>condMet(G.house,x))}
function handle(pid,m){
 if(!G)return;
 if(m.t==='join'){
  const conn=conns[pid];
  if(G.phase==='lobby'){
   if(G.players.length>=4){conn&&conn.send({t:'err',m:'房間已滿（最多 4 人）'});return}
   let name=m.name;if(G.players.some(p=>p.name===name))name+=G.players.length+1;
   G.players.push({pid,name,connected:true,voice:false});addLog(`${name} 加入了房間`);
  }else{
   const p=G.players.find(x=>x.name===m.name&&!x.connected);
   if(!p){conn&&conn.send({t:'err',m:'遊戲已開始，只能用原本的暱稱重新連線'});return}
   if(G.pending)G.pending=G.pending.map(x=>x===p.pid?pid:x);
   if(G.reacts&&G.reacts[p.pid]){G.reacts[pid]=G.reacts[p.pid];delete G.reacts[p.pid]}
   p.pid=pid;p.connected=true;addLog(`${p.name} 重新連線`);
  }
  return broadcast();
 }
 const p=P(pid);if(!p)return;
 if(m.t==='voice'){p.voice=!!m.on;return broadcast()}
 if(m.t==='start'&&pid===G.hostPid){startGame();return broadcast()}
 if(m.t==='lobby'&&pid===G.hostPid){G.phase='lobby';G.players=G.players.filter(x=>x.connected);G.players.forEach(x=>{delete x.conds});return broadcast()}
 if(m.t==='act')return doAction(p,m.a);
 if(m.t==='pass'&&G.phase==='action'&&G.players[G.turn]===p){addLog(`${p.name} 選擇 Pass，這回合不改動`,`${p.name} Pass`);G.last=null;advance();return broadcast()}
 if(m.t==='react'&&G.phase==='react'&&G.pending.includes(pid)){
  G.reacts[pid]=m.v;G.pending=G.pending.filter(x=>x!==pid);
  addLog(`${p.name}：${REACT[m.v]}`,`${p.name}，${REACT[m.v].slice(2)}`);
  if(!G.pending.length)advance();
  return broadcast();
 }
 if(m.t==='skip'&&G.phase==='react'&&(pid===G.players[G.turn].pid||pid===G.hostPid)){advance();return broadcast()}
 if(m.t==='reveal'&&G.phase!=='lobby'&&G.phase!=='end'){
  const reached=G.revealRounds.filter(r=>G.round>=r).length;
  if(p.revealed.length<reached&&!p.revealed.includes(m.i)&&p.conds[m.i]){p.revealed.push(m.i);addLog(`${p.name} 公開條件：「${condText(p.conds[m.i])}」`)}
  return broadcast();
 }
}
function startGame(){
 const ps=G.players.filter(x=>x.connected);
 if(ps.length<2){toast('至少需要 2 位玩家');return}
 const n=ps.length,cfg=CFG[n];let S,conds=null;
 for(let i=0;i<400&&!conds;i++){const T=randHouse();S=randHouse();conds=pickConds(T,S,n,cfg.k)}
 G.players=shuffle(ps);
 G.players.forEach((p,i)=>{p.conds=conds[i];p.revealed=[]});
 Object.assign(G,{phase:'action',house:S,round:1,turn:0,max:cfg.rounds,revealRounds:cfg.reveal,pending:[],reacts:{},last:null,result:null});
 G.log=[];addLog(`新局開始！共 ${cfg.rounds} 回合。輪到 ${G.players[0].name}`);
}
function doAction(p,a){
 if(G.phase!=='action'||G.players[G.turn]!==p)return;
 const h=G.house;let txt='';
 if(a.type==='paint'){if(a.c===h.walls[a.r])return;h.walls[a.r]=a.c;txt=`把${ROOMS[a.r]}的牆刷成${CN(a.c)}色`;G.last={r:a.r,w:1}}
 else{
  const cur=h.slots[a.r][a.t];
  if(a.type==='add'){if(cur!==null)return;h.slots[a.r][a.t]=a.c;txt=`在${ROOMS[a.r]}放了${itemName(a.t,a.c)}`}
  else if(a.type==='remove'){if(cur===null)return;h.slots[a.r][a.t]=null;txt=`移走${ROOMS[a.r]}的${itemName(a.t,cur)}`}
  else if(a.type==='swap'){if(cur===null||cur===a.c)return;h.slots[a.r][a.t]=a.c;txt=`把${ROOMS[a.r]}的${itemName(a.t,cur)}換成${itemName(a.t,a.c)}`}
  else return;
  G.last={r:a.r,t:a.t};
 }
 addLog(`${p.name} ${txt}`);
 if(G.players.every(allMet)){endGame(true);return broadcast()}
 G.phase='react';G.reacts={};G.pending=G.players.filter(x=>x!==p&&x.connected).map(x=>x.pid);
 if(!G.pending.length)advance();
 broadcast();
}
function advance(){
 G.turn++;
 if(G.turn>=G.players.length){G.turn=0;G.round++;
  if(G.round>G.max){G.round=G.max;endGame(false);return}
  if(G.revealRounds.includes(G.round))addLog(`第 ${G.round} 回合：每人可以公開一個自己的條件`);
 }
 G.phase='action';G.pending=[];
 addLog(`第 ${G.round} 回合，輪到 ${G.players[G.turn].name}`,`輪到 ${G.players[G.turn].name}`);
}
function endGame(win){
 const met=G.players.reduce((s,p)=>s+p.conds.filter(x=>condMet(G.house,x)).length,0);
 const left=win?G.max-G.round:0;
 G.phase='end';G.result={win,met,left,score:met*3+left*2};
 addLog(win?`大家都滿意了！默契分數 ${G.result.score}`:`回合用完，裝潢失敗……分數 ${G.result.score}`);
}
function makeView(pid){
 const me=P(pid);const v={me:pid,host:G.hostPid,code:G.code,phase:G.phase,log:G.log.slice(-40),
  players:G.players.map(p=>({pid:p.pid,name:p.name,connected:p.connected,voice:p.voice,sat:G.phase!=='lobby'&&allMet(p),revealed:(p.revealed||[]).map(i=>condText(p.conds[i])),react:G.reacts&&G.reacts[p.pid]}))};
 if(G.phase!=='lobby'){
  Object.assign(v,{house:G.house,round:G.round,max:G.max,turn:G.turn,revealRounds:G.revealRounds,pending:G.pending,last:G.last,result:G.result});
  if(me&&me.conds){const reached=G.revealRounds.filter(r=>G.round>=r).length;
   v.my=me.conds.map((x,i)=>({text:condText(x),met:condMet(G.house,x),rev:me.revealed.includes(i)}));v.canReveal=me.revealed.length<reached}
  if(G.phase==='end')v.all=G.players.map(p=>({name:p.name,conds:p.conds.map(x=>({text:condText(x),met:condMet(G.house,x)}))}));
 }
 return v;
}
function broadcast(){
 for(const p of G.players){
  if(p.pid===G.hostPid){const first=!view;view=makeView(p.pid);if(first)lastSpoken=G.logId;else speakNew();render()}
  else if(conns[p.pid]&&conns[p.pid].open)conns[p.pid].send({t:'state',v:makeView(p.pid)});
 }
}

/* ========== 語音：播報 / 語音評價 / 語音通話 ========== */
let ttsOn=store.get('mq_tts')!=='0',lastSpoken=0;
function say(t){if(!ttsOn||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=1.05;speechSynthesis.speak(u)}
function speakNew(){if(!view)return;for(const e of view.log)if(e.id>lastSpoken){say(e.say);lastSpoken=e.id}}
function toggleTTS(){ttsOn=!ttsOn;store.set('mq_tts',ttsOn?'1':'0');if(!ttsOn&&window.speechSynthesis)speechSynthesis.cancel();else say('語音播報已開啟');render()}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let listening=false;
function parseReact(s){if(/不喜歡|討厭|不好|醜|不要|不行|好怪|很怪|難看/.test(s))return'bad';if(/還好|普通|沒差|無所謂|都可以|一般|還行|可以/.test(s))return'meh';if(/喜歡|好看|讚|不錯|很好|漂亮|愛|棒/.test(s))return'good';return null}
function voiceReact(){
 if(!SR){toast('這個瀏覽器不支援語音辨識，請用 Chrome 或 Safari');return}
 const r=new SR();r.lang='zh-TW';r.interimResults=false;r.maxAlternatives=3;
 listening=true;render();
 r.onresult=e=>{const txt=[...e.results[0]].map(a=>a.transcript).join(' ');const v=parseReact(txt);if(v){send({t:'react',v});toast(`聽到「${e.results[0][0].transcript}」→ ${REACT[v]}`)}else toast(`聽到「${e.results[0][0].transcript}」，請說「喜歡／還好／不喜歡」`)};
 r.onerror=e=>toast('沒聽清楚：'+e.error);
 r.onend=()=>{listening=false;render()};
 r.start();
}

let localStream=null,calls={},muted=false;
async function toggleCall(){
 if(localStream){leaveCall();return}
 try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
 catch(e){toast('無法使用麥克風，請允許權限');return}
 muted=false;send({t:'voice',on:true});
 for(const p of view.players)if(p.pid!==view.me&&p.voice&&p.connected)attachCall(peer.call(p.pid,localStream),p.pid);
 toast('已加入語音通話');render();
}
function leaveCall(){Object.values(calls).forEach(c=>c.close());calls={};$('#audios').innerHTML='';localStream&&localStream.getTracks().forEach(t=>t.stop());localStream=null;send({t:'voice',on:false});render()}
function toggleMute(){muted=!muted;localStream&&localStream.getAudioTracks().forEach(t=>t.enabled=!muted);render()}
function onCall(call){if(!localStream){call.close();return}call.answer(localStream);attachCall(call,call.peer)}
function attachCall(call,pid){
 if(!call)return;if(calls[pid]&&calls[pid]!==call)calls[pid].close();calls[pid]=call;
 call.on('stream',s=>{let a=document.getElementById('au-'+pid);if(!a){a=document.createElement('audio');a.id='au-'+pid;a.autoplay=true;a.playsInline=true;$('#audios').appendChild(a)}a.srcObject=s;a.play().catch(()=>toast('點一下畫面以播放對方聲音'))});
 call.on('close',()=>{const a=document.getElementById('au-'+pid);a&&a.remove();if(calls[pid]===call)delete calls[pid]});
}
document.addEventListener('click',()=>document.querySelectorAll('#audios audio').forEach(a=>a.paused&&a.play().catch(()=>{})));

 return`<svg viewBox="0 0 40 40"><path d="M15 4h10v5c0 2 7 6 7 15 0 7-5 12-12 12S8 31 8 24c0-9 7-13 7-15z" fill="${col}" stroke="#0005"/><path d="M12 22h16" stroke="#ffffff99" stroke-width="2"/></svg>`;

function gameHTML(){

 const nextReveal=v.revealRounds.find(r=>r>v.round);
 let panel='';
 if(v.phase==='action')panel=myTurn?`<b>輪到你了！</b><div class="sub">點牆壁的 🖌 或任一格子：加入、移除、替換物品或改牆色（四選一）；不想動就按 Pass。</div><button class="mt" style="width:100%;font-weight:600" onclick="send({t:'pass'})">⏭️ Pass（這回合不改動）</button>`:`<div>等待 <b>${esc(cur.name)}</b> 行動…</div>`;
 else if(v.phase==='react'){
  if(v.pending.includes(v.me))panel=`<b>你覺得剛剛的改動如何？</b><div class="sub">只能表達感受，不能說出條件</div><div class="reacts mt">${Object.entries(REACT).map(([k,l])=>`<button onclick="send({t:'react',v:'${k}'})">${l}</button>`).join('')}</div><button class="mt ${listening?'listen':''}" style="width:100%" onclick="voiceReact()">🎤 ${listening?'聆聽中…':'用說的評價（喜歡／還好／不喜歡）'}</button>`;
  else panel=`<div>等待其他人評價：${v.pending.map(pid=>esc(v.players.find(p=>p.pid===pid)?.name||'')).join('、')}</div>${(cur.pid===v.me||host)?`<button class="mt" onclick="send({t:'skip'})">不等了，下一位</button>`:''}`;
 }else if(v.phase==='end'){const r=v.result;panel=`<div class="end"><div class="big">${r.win?'🎉':'🏚️'}</div><b>${r.win?'大家都滿意新家！':'回合用完，裝潢失敗'}</b><div>達成條件 ${r.met} 個 ×3 ${r.win?`＋剩餘回合 ${r.left} ×2`:''}＝ <b style="font-size:20px">${r.score} 分</b></div>${host?`<div class="row mt" style="justify-content:center"><button class="pri" onclick="send({t:'start'})">再玩一局</button><button onclick="send({t:'lobby'})">回大廳</button></div>`:'<div class="sub mt">等待房主開新局</div>'}</div>`}
 return`<div class="top"><span class="pill">第 <b>${v.round}</b> / ${v.max} 回合</span>${nextReveal?`<span class="pill">第 ${nextReveal} 回合可公開條件</span>`:''}<span class="grow"></span><button class="tog ${ttsOn?'on':''}" onclick="toggleTTS()">🔊</button><button class="tog ${localStream?'on':''}" onclick="toggleCall()">🎙️</button>${localStream?`<button class="tog" onclick="toggleMute()">${muted?'🔇':'🎤'}</button>`:''}</div>
 <div class="players">${v.players.map((p,i)=>`<div class="pc ${i===v.turn&&v.phase!=='end'?'cur':''} ${p.connected?'':'off'}">${i===v.turn&&v.phase!=='end'?'👉':''}${esc(p.name)}${p.pid===v.me?'（你）':''} ${p.sat?'😊':''}${p.voice?'🎙️':''}${p.react&&v.phase==='react'?`<div class="r">${REACT[p.react]}</div>`:''}</div>`).join('')}</div>
 <div class="floor">樓上</div>
 <div class="board ${myTurn?'':'locked'}">${roomHTML(0)}${roomHTML(1)}</div>
 <div class="floor">樓下</div>
 <div class="board ${myTurn?'':'locked'}">${roomHTML(2)}${roomHTML(3)}</div>
 <div class="legend mt">${STYLES.map((s,i)=>`<span>${STYLE_MARK[i]} ${s}</span>`).join('')}<span>｜😊＝條件全達成</span></div>
 <div class="card panel">${panel}</div>
 ${v.phase==='end'?allCondsHTML():myCondsHTML()}
 ${revealedHTML()}
 <div class="card"><details><summary>行動紀錄</summary><div class="log mt">${v.log.slice().reverse().map(e=>`<div>${esc(e.text)}</div>`).join('')}</div></details></div>
 ${rulesHTML()}`;
}
function roomHTML(r){const h=view.house,w=h.walls[r],L=view.last||{};
 return`<div class="room ${L.r===r&&L.w?'flash':''}" style="--wall:${COLORS[w].c}"><div class="room-h"><span>${ROOM_ICON[r]} ${ROOMS[r]}</span><button class="paint" onclick="openWall(${r})">🖌 ${CN(w)}牆</button></div>
 <div class="slots">${[0,1,2].map(t=>{const c=h.slots[r][t],fl=L.r===r&&L.t===t?'flash':'';
  return c===null?`<button class="slot empty ${fl}" onclick="openSlot(${r},${t})"><span class="ph">＋<br>${TYPES[t]}</span></button>`:`<button class="slot ${fl}" onclick="openSlot(${r},${t})">${icon(t,c)}<span class="mk">${STYLE_MARK[styleOf(t,c)]}</span><span class="lb">${STYLES[styleOf(t,c)]}</span></button>`}).join('')}</div></div>`}
function myCondsHTML(){const v=view;if(!v.my)return'';
 return`<div class="card"><b>🔒 我的祕密條件</b>${v.canReveal?`<div class="sub">現在可以公開其中一個條件</div>`:''}<ul class="conds">${v.my.map((c,i)=>`<li><span class="chk">${c.met?'✅':'⬜'}</span><span class="t">${esc(c.text)}${c.rev?' <span class="sub">（已公開）</span>':''}</span>${v.canReveal&&!c.rev?`<button onclick="send({t:'reveal',i:${i}})">公開</button>`:''}</li>`).join('')}</ul></div>`}
function revealedHTML(){const rs=view.players.filter(p=>p.revealed.length&&p.pid!==view.me);if(!rs.length||view.phase==='end')return'';
 return`<div class="card"><b>📢 已公開的條件</b>${rs.map(p=>p.revealed.map(t=>`<div class="mt"><b>${esc(p.name)}</b>：${esc(t)}</div>`).join('')).join('')}</div>`}
function allCondsHTML(){return`<div class="card"><b>大家的祕密條件</b>${view.all.map(p=>`<div class="mt"><b>${esc(p.name)}</b><ul class="conds">${p.conds.map(c=>`<li><span class="chk">${c.met?'✅':'❌'}</span><span class="t">${esc(c.text)}</span></li>`).join('')}</ul></div>`).join('')}</div>`}
function rulesHTML(){return`<div class="card"><details><summary>📖 遊戲規則</summary><div class="sub mt">
<p><b>目標：</b>大家剛搬進新家，每人手上有幾個祕密的裝潢條件。所有人的條件「同時」達成，就一起獲勝（合作遊戲）。</p>
<p><b>房子：</b>4 個房間（樓上臥室、浴室；樓下客廳、廚房）。每間有一面牆和 3 個位置：燈具、掛畫、擺飾。物品有 4 種顏色，每件物品也有固定風格（◆現代 ●復古 ♛古典 ✦奇趣）。</p>
<p><b>輪到你時，四選一：</b>①在空位加入物品 ②移除一件物品 ③把物品換成同類型的其他款 ④重新粉刷一面牆。也可以按 <b>Pass</b> 這回合不改動，直接換下一位。</p>
<p><b>評價：</b>每次改動後，其他玩家只能回應「喜歡／還好／不喜歡」，嚴禁暗示條件內容。可以按按鈕，也可以用說的。</p>
<p><b>交流時刻：</b>到了特定回合，每人可以公開自己一個條件。</p>
<p><b>結束：</b>所有人條件都達成（名字旁出現😊）立即獲勝；回合用完則失敗。分數＝達成條件數×3＋剩餘回合×2。</p>
<p><b>語音：</b>🔊 播報會念出每個動作與評價；🎙️ 語音通話讓不在同一處的玩家互相聽到（建議只在公開條件時刻或賽後交談，維持遊戲樂趣）。</p>
<p>人數設定：2 人 30 回合／每人 5 條件；3 人 20 回合／4 條件；4 人 15 回合／3 條件。房主請保持頁面開啟。</p></div></details></div>`}

/* ========== 行動選單 ========== */
function openSheet(html){$('#sheetBox').innerHTML=html+`<button class="mt" style="width:100%" onclick="closeSheet()">取消</button>`;$('#sheet').classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show')}
function act(a){closeSheet();send({t:'act',a})}
function openSlot(r,t){const c=view.house.slots[r][t];
 if(c===null)openSheet(`<b>在${ROOMS[r]}加入${TYPES[t]}</b><div class="opts">${[0,1,2,3].map(x=>`<button class="opt" onclick="act({type:'add',r:${r},t:${t},c:${x}})">${icon(t,x)}<span>${itemName(t,x)}</span></button>`).join('')}</div>`);
 else openSheet(`<b>${ROOMS[r]}的${itemName(t,c)}</b><button class="mt" style="width:100%" onclick="act({type:'remove',r:${r},t:${t}})">🗑️ 移除這件</button><div class="sub mt">或換成：</div><div class="opts">${[0,1,2,3].filter(x=>x!==c).map(x=>`<button class="opt" onclick="act({type:'swap',r:${r},t:${t},c:${x}})">${icon(t,x)}<span>${itemName(t,x)}</span></button>`).join('')}</div>`);
}
function openWall(r){const w=view.house.walls[r];
 openSheet(`<b>重新粉刷${ROOMS[r]}的牆（目前${CN(w)}色）</b><div class="opts">${[0,1,2,3].filter(x=>x!==w).map(x=>`<button class="opt" onclick="act({type:'paint',r:${r},c:${x}})"><span class="sw" style="background:${COLORS[x].c}"></span><span>${CN(x)}色</span></button>`).join('')}</div>`)}

window.addEventListener('beforeunload',e=>{if(isHost&&G&&G.phase!=='lobby'){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
</html>
